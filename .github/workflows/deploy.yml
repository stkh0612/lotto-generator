# 1. 트리거 설정 (push, schedule, workflow_dispatch)
on:
  push:
    branches:
      - master
  schedule:
    # 매주 토요일 KST 20:45 (UTC 11:45), 21:15 (UTC 12:15), 22:00 (UTC 13:00) 3회 자동 실행
    - cron: '45 11 * * 6'
    - cron: '15 12 * * 6'
    - cron: '0 13 * * 6'
  workflow_dispatch:

# 2. GitHub Token 권한 확대 (레포 쓰기 및 Pages 배포 권한)
permissions:
  contents: write     # repo 컨텐츠 읽기/쓰기 및 푸시 권한
  pages: write        # GitHub Pages 권한
  id-token: write     # OIDC 토큰

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 3. 코드 체크아웃 (자동 업데이트 커밋 푸시를 위해 persist-credentials를 true로 설정)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # 4. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 5. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 6. 로또 번호 업데이트 스크립트 실행
      - name: Update Lotto Numbers
        run: npm run update:lotto

      # 7. 프로덕션 빌드 및 정적 SEO/사이트맵 생성
      - name: Build and Generate SEO Pages
        run: npm run build

      # 8. 데이터 및 사이트맵 업데이트 발생 시 Git에 반영
      - name: Commit and push changes if updated
        id: check_update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/lotto_numbers_en.json public/sitemap.xml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update lotto numbers & sitemap [skip actions]"
            git push origin master
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "No changes in lotto numbers file."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      # 9. gh-pages 브랜치에 dist/ 업로드 (GitHub Pages 백업)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: lottomate.life

      # 10. IndexNow 색인 자동 제출 (Bing, Naver 등)
      - name: Submit URLs to IndexNow
        run: npm run submit:indexnow
        continue-on-error: true

      # 11. 로또 번호가 업데이트 되었을 때만 이메일 발송
      - name: Send mail on update success
        if: steps.check_update.outputs.updated == 'true' && env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Lottomate] 로또 당첨 번호 및 사이트맵 자동 갱신 완료!"
          to: superman612@kakao.com
          from: Lottomate Auto Update <${{ secrets.MAIL_USERNAME }}>
          body: |
            로또 신규 당첨 번호와 정적 SEO 페이지가 성공적으로 업데이트 및 배포되었습니다.
            
            - 대상 사이트: https://lottomate.life
            - 일시: KST 토요일 저녁 (GitHub Actions 자동 실행 완료)
            - 커밋 확인: https://github.com/${{ github.repository }}/commits/master


