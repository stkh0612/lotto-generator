<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>페이지를 찾을 수 없습니다 (404 Not Found) · 로또메이트</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8faf8;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 520px;
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }
    .badge {
      display: inline-block;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: inline-block;
      background: #17653a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 14px;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #12532f;
    }
    .btn-secondary {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">404 Not Found</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>
      요청하신 페이지가 삭제되었거나, 주소가 잘못 입력되었을 수 있습니다.<br />
      입력하신 URL 주소를 다시 한번 확인해 주세요.
    </p>
    <div class="btn-group">
      <a href="/" class="btn-primary">로또메이트 홈으로 이동</a>
      <a href="/results" class="btn-secondary">당첨 번호 조회</a>
      <a href="/stats" class="btn-secondary">역대 통계 분석</a>
    </div>
    <div class="footer-note">
      © 2026 로또메이트 (LottoMate)
    </div>
  </div>
</body>
</html>
